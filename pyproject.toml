[build-system]
requires = ["hatchling>=1.25,<1.28"]
build-backend = "hatchling.build"

[project]
name = "cite-guard"
version = "0.1.0"
description = "Verify in code that an LLM answer cites only the sources it was actually given. A guarantee, not a prompt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Jafar Banar", email = "jaafar.banar@gmail.com" }]
keywords = ["llm", "rag", "citations", "hallucination", "grounding", "evaluation", "guardrail"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/JafarBanar/cite-guard"
Issues = "https://github.com/JafarBanar/cite-guard/issues"
Changelog = "https://github.com/JafarBanar/cite-guard/blob/main/CHANGELOG.md"

[project.scripts]
cite-guard = "cite_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cite_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
