name: publish

# Publishes to PyPI on a GitHub release, using PyPI Trusted Publishing (no token).
# One-time setup on pypi.org: Your projects -> Publishing -> add GitHub publisher
#   owner: JafarBanar, repository: groundcite, workflow: publish.yml, environment: pypi

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
